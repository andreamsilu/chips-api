name: Backend checks

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mloexpress_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-test-only
          MYSQL_ROOT_PASSWORD: ci-root-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_DATABASE: mloexpress_test
      DB_USERNAME: ci
      DB_PASSWORD: ci-test-only
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      CACHE_STORE: array
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, redis, mbstring, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --no-check-publish && composer audit
      - run: php vendor/bin/phpunit
      - run: php vendor/bin/phpunit tests/Integration/MySqlConcurrencyTest.php
      - run: composer analyse
      - run: composer format && git diff --exit-code
      - run: composer openapi && git diff --exit-code -- docs/openapi.json
