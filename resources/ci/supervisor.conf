[program:chips-api-payments]
directory=/var/www/chips-api
command=/usr/bin/php8.5 artisan queue:work redis --queue=payments --sleep=1 --timeout=45 --tries=6 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chips-api-payments.log

[program:chips-api-notifications]
directory=/var/www/chips-api
command=/usr/bin/php8.5 artisan queue:work redis --queue=notifications,default --sleep=1 --timeout=45 --tries=5 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chips-api-notifications.log

[program:chips-api-scheduler]
directory=/var/www/chips-api
command=/usr/bin/php8.5 artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chips-api-scheduler.log

[program:chips-api-reverb]
directory=/var/www/chips-api
command=/usr/bin/php8.5 artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chips-api-reverb.log
